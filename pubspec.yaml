name: stack_money
description: "A modern multi-tenant personal finance mobile app built with Flutter & Firebase. Replaces rigid spreadsheets with dynamic salary allocation, automated zero-friction closure wizards, and time-based data archiving via Cloud Functions."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  google_fonts: ^8.2.1
  go_router: ^17.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  fl_chart: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  uuid: ^4.6.0
  local_auth: ^3.0.2
  currency_formatter: ^2.3.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  firebase_remote_config: ^6.5.6
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/app_icon.png
    - assets/images/app_icon_nobackground.png
    - assets/images/app_icon_safe.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path_android: "assets/images/app_icon_safe.png"
  adaptive_icon_background: "#141416"
  adaptive_icon_foreground: "assets/images/app_icon_safe.png"

  image_path_ios: "assets/images/app_icon_safe.png"

flutter_native_splash:
  color: "#141416"
  image: assets/images/app_icon_safe.png

  fullscreen: true

  android_12:
    color: "#141416"
    image: assets/images/app_icon_safe.png
